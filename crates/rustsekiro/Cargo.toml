[package]
name = "sv1"
version = "0.2.1"
edition = "2024"

# The game is a library too (src/lib.rs), so another Bevy app can use it; sv1 is its program.
[lib]
name = "rustsekiro"
path = "src/lib.rs"

[[bin]]
name = "sv1"
path = "src/main.rs"
required-features = ["host"]

[features]
# In this repo the combat runs inside sekiro-rs's game (crates/game, `--play` and
# `--rustsekiro`): the camera and the debug menu over the combat core; the map, lighting and
# sound are the game's.
default = ["embed"]
embed = ["dep:libloading"]
# RustSekiro's own program (`sv1`: its window, map, HUD, menus and sound) builds only in the
# RustSekiro repo, where sekiro-rs's game is a dependency; here the game depends on this crate,
# so the feature has no dependencies and is never enabled.
host = ["embed"]

[dependencies]
bevy = { version = "0.20.0", features = ["dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libloading = { version = "0.8", optional = true }
# This repo's file readers (the draw params' GPARAM for the tests that check the lighting).
sekiro-formats = { path = "../formats" }
# This repo's HavokScript VM (crates/hks): runs the game's compiled scripts from
# extracted/action/script, the bytecode the game itself runs (src/hks.rs HksVm).
sekiro-hks = { path = "../hks" }

# The shader tests (src/shader_tests.rs) validate the composed shaders with naga, through the
# wgpu Bevy 0.20 already uses.
[dev-dependencies]
wgpu = { version = "30", default-features = false }
# Standard Lua 5.1 (built from source) for the game's own player script, decompiled HKS
# (src/hks_lua.rs, a trial run by the tests only for now).
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }

# Profiles are the workspace's (the root Cargo.toml, `quick` among them).
